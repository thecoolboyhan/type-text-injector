[package]
name = "type-text-injector"
version = "0.1.0"
edition = "2021"
description = "把本机文本模拟键盘输入到当前光标处（含虚拟机/远程桌面），跨平台：macOS / Linux / Windows"
license = "MIT"
repository = "https://github.com/thecoolboyhan/type-text-injector"
keywords = ["keyboard", "automation", "macos", "linux", "windows", "xdotool", "applescript", "clipboard"]
categories = ["command-line-utilities"]

# 核心库：CLI (main.rs) 与 GUI (gui.rs) 共用注入后端
[lib]
name = "type_text_injector"
path = "src/lib.rs"

[[bin]]
name = "type-text"
path = "src/main.rs"

# 仅 Windows 需要 enigo（Win32 SendInput）；macOS/Linux 走系统自带命令，无编译依赖。
[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"

# GUI 依赖（eframe + rfd 文件对话框）：
# 只对「非 musl 且非 Windows」目标启用 —— macOS / linux-gnu 原生构建自动带 GUI；
# Linux musl 静态交叉编译（.cargo/config.toml）自动跳过 GUI，保持纯 CLI、无系统 GL/X11 库依赖；
# Windows 也跳过 GUI：eframe 默认启用 wgpu 后端，wgpu-hal 的 D3D12 代码在 Windows 上编译失败
# （windows crate 版本兼容问题，见 AGENTS.md），Windows 版保持纯 CLI（enigo 注入，与 v0.1.0 一致）。
[target.'cfg(all(not(target_env = "musl"), not(target_os = "windows")))'.dependencies]
eframe = "0.36"
rfd = "0.17"
